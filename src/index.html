      activeCategory: 'all',

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // 将快捷键字符串格式化为精致的 <kbd> 键帽，组合键连接符用浅灰色
    function renderKeycaps(keysStr) {
      const tokens = keysStr.split(/(\s+\+\s+|\s+\/\s+|\s+→\s+)/g);
      return tokens.map(token => {
        const t = token.trim();
        if (t === '+' || t === '/' || t === '→') {
          return `<span class="kbd-sep">${t}</span>`;
        }
        return `<kbd class="kbd-cap">${escapeHtml(token)}</kbd>`;
      }).join('');
    }

    // 过滤逻辑：支持分类 + 关键词多词模糊匹配（兼容忽略空格如 Win+V）
    function getFilteredItems() {
      const q = state.query.trim().toLowerCase();
      return SHORTCUTS.filter(item => {
        if (state.activeCategory !== 'all' && item.cat !== state.activeCategory) {
          return false;
        }
        if (!q) return true;

        const catObj = CATEGORIES.find(c => c.id === item.cat);
        const searchPool = [
          item.title,
          item.desc,
          item.keys,
          item.keys.replace(/\s+/g, ''),
          catObj ? catObj.label : ''
        ].join(' ').toLowerCase();

        return q.split(/\s+/).every(term => searchPool.includes(term));
      });
    }

    /**
     * =========================================================================
     * 3. 视图渲染：桌面侧边栏、移动端分类栏、文档主体
     * =========================================================================
     */
    function renderNavigation() {
      const desktopNav = document.getElementById('desktopNav');
      const mobileNav = document.getElementById('mobileNav');

      const getCount = (catId) =>
        catId === 'all' ? SHORTCUTS.length : SHORTCUTS.filter(i => i.cat === catId).length;

      // 桌面端左侧导航
      desktopNav.innerHTML = CATEGORIES.map(cat => {
        const isActive = state.activeCategory === cat.id;
        const count = getCount(cat.id);
        return `
          <button
            type="button"
            data-cat="${cat.id}"
            class="w-full flex items-center justify-between px-3 py-2 rounded-md text-[13px] transition-colors text-left ${
              isActive
                ? 'bg-[#EFEFF1] text-[#18181B] font-medium'
                : 'text-[#52525B] hover:text-[#18181B] hover:bg-[#F4F4F5]/70'
            }"
          >
            <span class="truncate">${cat.label}</span>
            <span class="text-[11px] tabular-nums ${isActive ? 'text-[#52525B]' : 'text-[#A1A1AA]'}">${count}</span>
          </button>
        `;
      }).join('');

      // 移动端顶部横向分类
      mobileNav.innerHTML = CATEGORIES.map(cat => {
        const isActive = state.activeCategory === cat.id;
        return `
          <button
            type="button"
            data-cat="${cat.id}"
            class="shrink-0 px-2.5 py-1 rounded-md text-[12.5px] transition-colors ${
              isActive
                ? 'bg-[#18181B] text-white font-medium'
                : 'text-[#52525B] bg-[#F4F4F5] hover:text-[#18181B]'
            }"
          >
            ${cat.label}
          </button>
        `;
      }).join('');
    }

    function renderDocument() {
      const docContent = document.getElementById('docContent');
      const emptyState = document.getElementById('emptyState');
      const filtered = getFilteredItems();

      if (filtered.length === 0) {
        docContent.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      // 按分类组织为清晰的文档章节
      const realCategories = CATEGORIES.filter(c => c.id !== 'all');
      const sectionsHtml = realCategories.map(cat => {
        const items = filtered.filter(item => item.cat === cat.id);
        if (items.length === 0) return '';

        const rowsHtml = items.map(item => `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 sm:gap-6 py-3 px-2.5 -mx-2.5 rounded-lg hover:bg-[#FAFAFA] transition-colors border-b border-[#F4F4F5] last:border-b-0">
            <div class="min-w-0">
              <div class="text-[14px] font-medium text-[#18181B] leading-snug">
                ${escapeHtml(item.title)}
              </div>
              <div class="text-[13px] text-[#71717A] mt-0.5 leading-relaxed">
                ${escapeHtml(item.desc)}
              </div>
            </div>
            <div class="shrink-0 flex flex-wrap items-center sm:justify-end gap-y-1">
              ${renderKeycaps(item.keys)}
            </div>
          </div>
        `).join('');

        return `
          <section>
            <div class="flex items-baseline justify-between pb-2.5 mb-1 border-b border-[#EAEAEA]">
              <h2 class="text-[15px] font-semibold tracking-tight text-[#18181B]">
                ${cat.label}
              </h2>
              <span class="text-[12px] text-[#A1A1AA] tabular-nums">
                ${items.length} 项
              </span>
            </div>
            <div>
              ${rowsHtml}
            </div>
          </section>
        `;
      }).join('');

      docContent.innerHTML = sectionsHtml;
    }

    function renderAll() {
      renderNavigation();
      renderDocument();
    }

    /**
     * =========================================================================
     * 4. 事件绑定：分类切换、实时搜索、/ 聚焦与 Esc 清空
     * =========================================================================
     */
    function handleNavClick(e) {
      const btn = e.target.closest('button[data-cat]');
      if (!btn) return;
      state.activeCategory = btn.dataset.cat;
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('desktopNav').addEventListener('click', handleNavClick);
    document.getElementById('mobileNav').addEventListener('click', handleNavClick);

    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const slashHint = document.getElementById('slashHint');

    function syncSearchControls() {
      const hasText = searchInput.value.length > 0;
      clearSearchBtn.classList.toggle('hidden', !hasText);
      slashHint.classList.toggle('hidden', hasText);
    }

    searchInput.addEventListener('input', (e) => {
      state.query = e.target.value;
      syncSearchControls();
      renderDocument();
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      state.query = '';
      syncSearchControls();
      renderDocument();
      searchInput.focus();
    });

    // 键盘快捷键：按 / 聚焦搜索框，按 Esc 清空并失焦
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput && !e.ctrlKey && !e.metaKey && !e.altKey) {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      } else if (e.key === 'Escape') {
        if (searchInput.value) {
          searchInput.value = '';
          state.query = '';
          syncSearchControls();
          renderDocument();
        }
        if (document.activeElement === searchInput) {
          searchInput.blur();
        }
      }
    });

    // 初始渲染
    renderAll();
  </script>
</body>
</html>
