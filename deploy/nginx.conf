# 部署到 1Panel / OpenResty 的虚拟主机模板
# 纯静态站点：直接以 sites/<alias>/index 为 root，不需要额外的反代或容器
server {
    listen 80 ;
    server_name __DOMAIN__ ;
    index index.html ;
    access_log /www/sites/__ALIAS__/log/access.log main ;
    error_log /www/sites/__ALIAS__/log/error.log ;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404 ;
    }

    location ^~ /.well-known/acme-challenge {
        allow all ;
        root /usr/share/nginx/html ;
    }

    root /www/sites/__ALIAS__/index ;

    # 静态资源长缓存，HTML 不缓存，改版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache" ;
    }

    location /assets/ {
        expires 7d ;
        add_header Cache-Control "public, immutable" ;
    }

    include /www/sites/__ALIAS__/proxy/*.conf ;
}
